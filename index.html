<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Print Queue</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Barlow:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #141414;
    --border: #2a2a2a;
    --accent: #ff6b1a;
    --accent2: #ffaa00;
    --text: #e8e8e8;
    --muted: #999;
    --mono: 'Share Tech Mono', monospace;
    --sans: 'Barlow', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 40px 20px 80px;
    background-image: 
      repeating-linear-gradient(0deg, transparent, transparent 39px, #1a1a1a 39px, #1a1a1a 40px),
      repeating-linear-gradient(90deg, transparent, transparent 39px, #1a1a1a 39px, #1a1a1a 40px);
    background-size: 40px 40px;
  }

  .header {
    width: 100%;
    max-width: 640px;
    margin-bottom: 40px;
    position: relative;
  }

  .header::before {
    content: '';
    display: block;
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent2), transparent);
    margin-bottom: 24px;
  }

  .tag {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .tag::before {
    content: '▶';
    font-size: 8px;
    animation: blink 1.2s step-end infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; } 50% { opacity: 0; }
  }

  h1 {
    font-family: var(--sans);
    font-weight: 700;
    font-size: clamp(28px, 5vw, 42px);
    line-height: 1.1;
    letter-spacing: -1px;
    color: #fff;
  }

  h1 span {
    color: var(--accent);
  }

  .subtitle {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    margin-top: 10px;
    letter-spacing: 0.5px;
  }

  .form-card {
    width: 100%;
    max-width: 640px;
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 36px;
    position: relative;
    animation: slideUp 0.5s ease both;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .form-card::after {
    content: '';
    position: absolute;
    bottom: 0; right: 0;
    width: 40px; height: 40px;
    border-right: 2px solid var(--accent);
    border-bottom: 2px solid var(--accent);
  }

  .form-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 40px; height: 40px;
    border-left: 2px solid var(--accent);
    border-top: 2px solid var(--accent);
  }

  .section-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--accent);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin: 28px 0 16px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-label::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .section-label:first-child { margin-top: 0; }

  .field {
    margin-bottom: 18px;
    animation: fadeIn 0.4s ease both;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateX(-6px); }
    to { opacity: 1; transform: translateX(0); }
  }

  label {
    display: block;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #aaa;
    margin-bottom: 7px;
  }

  label span.req { color: var(--accent); margin-left: 3px; }

  input, select, textarea {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--sans);
    font-size: 15px;
    padding: 12px 14px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    -webkit-appearance: none;
    border-radius: 0;
  }

  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px rgba(255,107,26,0.12);
  }

  input::placeholder, textarea::placeholder { color: var(--muted); font-size: 14px; }

  textarea { resize: vertical; min-height: 100px; line-height: 1.6; }

  select { cursor: pointer; }
  select option { background: #1a1a1a; }

  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 500px) { .row { grid-template-columns: 1fr; } }

  .urgency-group {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }

  .urgency-option { display: none; }

  .urgency-option + label {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 14px 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.2s;
    font-size: 11px;
    letter-spacing: 1.5px;
    gap: 6px;
    text-transform: uppercase;
    color: var(--muted);
  }

  .urgency-icon { font-size: 20px; }

  .urgency-option:checked + label {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,107,26,0.06);
  }

  .urgency-option + label:hover {
    border-color: #555;
    color: var(--text);
  }

  .submit-btn {
    width: 100%;
    margin-top: 32px;
    padding: 16px;
    background: var(--accent);
    border: none;
    color: #000;
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
  }

  .submit-btn:hover { background: #ff8040; }
  .submit-btn:active { transform: scale(0.99); }
  .submit-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

  .submit-btn .spinner {
    display: none;
    width: 16px; height: 16px;
    border: 2px solid #000;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin: 0 auto;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .success-msg {
    display: none;
    text-align: center;
    padding: 40px 20px;
  }

  .success-msg .check {
    font-size: 48px;
    margin-bottom: 16px;
    animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.5); }
    to { opacity: 1; transform: scale(1); }
  }

  .success-msg h2 {
    font-size: 22px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 8px;
  }

  .success-msg p {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .success-msg button {
    background: none;
    border: 1px solid var(--border);
    color: var(--muted);
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 2px;
    padding: 10px 20px;
    cursor: pointer;
    transition: all 0.2s;
    text-transform: uppercase;
  }

  .success-msg button:hover { border-color: var(--accent); color: var(--accent); }

  .error-msg {
    display: none;
    background: rgba(255,50,50,0.08);
    border: 1px solid #ff3333;
    color: #ff6666;
    font-family: var(--mono);
    font-size: 12px;
    padding: 12px 14px;
    margin-top: 14px;
    letter-spacing: 0.5px;
  }

  .footer {
    margin-top: 40px;
    font-family: var(--mono);
    font-size: 11px;
    color: #333;
    letter-spacing: 1px;
    text-align: center;
  }

  /* Custom Design Toggle */
  .toggle-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    border: 1px solid var(--border);
    background: #0d0d0d;
    cursor: pointer;
    user-select: none;
    transition: border-color 0.2s;
    margin-bottom: 18px;
  }

  .toggle-row:hover { border-color: #444; }
  .toggle-row.active { border-color: var(--accent); }

  .toggle-label {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .toggle-label strong {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: 0;
    text-transform: none;
  }

  .toggle-label span {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.5px;
    text-transform: none;
    font-weight: 400;
  }

  .toggle-switch {
    width: 44px;
    height: 24px;
    background: var(--border);
    border-radius: 12px;
    position: relative;
    transition: background 0.2s;
    flex-shrink: 0;
  }

  .toggle-switch::after {
    content: '';
    position: absolute;
    width: 18px; height: 18px;
    background: #fff;
    border-radius: 50%;
    top: 3px; left: 3px;
    transition: transform 0.2s;
  }

  .toggle-row.active .toggle-switch {
    background: var(--accent);
  }

  .toggle-row.active .toggle-switch::after {
    transform: translateX(20px);
  }

  .custom-design-section {
    display: none;
    border: 1px solid rgba(255,107,26,0.25);
    border-top: none;
    padding: 20px 16px 4px;
    margin-top: -18px;
    margin-bottom: 18px;
    background: rgba(255,107,26,0.03);
    animation: fadeIn 0.3s ease both;
  }

  .custom-design-section.visible { display: block; }
</style>
</head>
<body>

<div class="header">
  <div class="tag">3D Print Service</div>
  <h1>Submit a<br><span>Print Job</span></h1>
  <p class="subtitle">// Fill in the details below — I'll be in touch once reviewed</p>
</div>

<div class="form-card" id="formCard">
  <div id="formContent">
    <div class="section-label">Contact</div>

    <div class="row">
      <div class="field" style="animation-delay:0.05s">
        <label>Name <span class="req">*</span></label>
        <input type="text" id="name" placeholder="Your name" required>
      </div>
      <div class="field" style="animation-delay:0.1s">
        <label>Contact / Email <span class="req">*</span></label>
        <input type="text" id="contact" placeholder="Email or @handle" required>
      </div>
    </div>

    <div class="section-label">Print Details</div>

    <div class="field" style="animation-delay:0.15s">
      <label>What do you need printed? <span class="req">*</span></label>
      <textarea id="description" placeholder="Describe what you want — include dimensions, use case, any special requirements..."></textarea>
    </div>

    <div class="field" style="animation-delay:0.2s">
      <label>File Link (STL / 3MF / OBJ)</label>
      <input type="url" id="fileLink" placeholder="https://... (Thingiverse, Google Drive, Dropbox, etc.)">
    </div>

    <div class="row">
      <div class="field" style="animation-delay:0.25s">
        <label>Material</label>
        <select id="material">
          <option value="">— Select —</option>
          <option>PLA</option>
          <option>PETG</option>
          <option>ABS</option>
          <option>TPU (Flexible)</option>
          <option>No preference</option>
        </select>
      </div>
      <div class="field" style="animation-delay:0.3s">
        <label>Color Preference</label>
        <input type="text" id="color" placeholder="e.g. Black, any, doesn't matter">
      </div>
    </div>

    <div class="row">
      <div class="field" style="animation-delay:0.35s">
        <label>Quantity</label>
        <input type="number" id="quantity" placeholder="1" min="1" value="1">
      </div>
      <div class="field" style="animation-delay:0.4s">
        <label>Approx. Size</label>
        <input type="text" id="size" placeholder="e.g. 10×10×5 cm, palm-sized">
      </div>
    </div>

    <div class="section-label">Timing</div>

    <div class="field" style="animation-delay:0.45s">
      <label>Urgency</label>
      <div class="urgency-group">
        <input class="urgency-option" type="radio" name="urgency" id="u1" value="No rush" checked>
        <label for="u1"><span class="urgency-icon">🐢</span>No Rush</label>

        <input class="urgency-option" type="radio" name="urgency" id="u2" value="Within a week">
        <label for="u2"><span class="urgency-icon">📅</span>This Week</label>

        <input class="urgency-option" type="radio" name="urgency" id="u3" value="ASAP">
        <label for="u3"><span class="urgency-icon">⚡</span>ASAP</label>
      </div>
    </div>

    <div class="field" style="animation-delay:0.5s">
      <label>Deadline (if any)</label>
      <input type="date" id="deadline">
    </div>

    <div class="section-label">Custom Design</div>

    <div class="toggle-row" id="customToggle" onclick="toggleCustomDesign()">
      <label class="toggle-label" style="text-transform:none; letter-spacing:0; color:inherit; margin:0; cursor:pointer">
        <strong>I need a custom design made</strong>
        <span>// You don't have an STL — you want something designed from scratch</span>
      </label>
      <div class="toggle-switch"></div>
    </div>

    <div class="custom-design-section" id="customDesignSection">
      <div class="field">
        <label>Describe your design idea <span class="req">*</span></label>
        <textarea id="customDescription" placeholder="Be as detailed as possible — shape, dimensions, function, inspiration images, reference links..." style="min-height:120px"></textarea>
      </div>
      <div class="row">
        <div class="field">
          <label>Reference images / links</label>
          <input type="text" id="customRefs" placeholder="Links to sketches, photos, similar objects...">
        </div>
        <div class="field">
          <label>Exact dimensions needed?</label>
          <select id="customDimensions">
            <option value="">— Select —</option>
            <option>Yes — I'll specify in description</option>
            <option>Approximate is fine</option>
            <option>Flexible / up to you</option>
          </select>
        </div>
      </div>
      <div class="field">
        <label>Complexity</label>
        <select id="customComplexity">
          <option value="">— Select —</option>
          <option>Simple (basic shape, logo, nameplate)</option>
          <option>Medium (functional part, enclosure, bracket)</option>
          <option>Complex (multi-part, moving pieces, detailed)</option>
          <option>Not sure</option>
        </select>
      </div>
    </div>

    <div class="section-label">Anything else?</div>

    <div class="field" style="animation-delay:0.55s">
      <label>Notes / Special Requests</label>
      <textarea id="notes" placeholder="Infill %, supports, layer height, finish quality, assembly required, anything else..." style="min-height:80px"></textarea>
    </div>

    <button class="submit-btn" id="submitBtn" onclick="submitForm()">
      <span id="btnText">Submit Print Request</span>
      <div class="spinner" id="spinner"></div>
    </button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <div class="success-msg" id="successMsg">
    <div class="check">🖨️</div>
    <h2>Request Submitted!</h2>
    <p>// Job added to queue — I'll review and get back to you</p>
    <button onclick="resetForm()">Submit Another</button>
  </div>
</div>

<script>
  const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwVtw2_tf7H2IuSC0jBNWvfzLMns-zYt3iysUB7bCkzV4a4OLTGGsAtNwPC3bpHIUDk/exec';

  let isCustomDesign = false;

  function toggleCustomDesign() {
    isCustomDesign = !isCustomDesign;
    document.getElementById('customToggle').classList.toggle('active', isCustomDesign);
    document.getElementById('customDesignSection').classList.toggle('visible', isCustomDesign);
  }

  function getUrgency() {
    return document.querySelector('input[name="urgency"]:checked')?.value || 'No rush';
  }

  async function submitForm() {
    const name = document.getElementById('name').value.trim();
    const contact = document.getElementById('contact').value.trim();
    const description = document.getElementById('description').value.trim();

    if (!name || !contact || !description) {
      showError('Please fill in all required fields (Name, Contact, Description).');
      return;
    }

    if (isCustomDesign && !document.getElementById('customDescription').value.trim()) {
      showError('Please describe your custom design idea.');
      return;
    }

    const data = {
      timestamp: new Date().toLocaleString(),
      name,
      contact,
      description,
      fileLink: document.getElementById('fileLink').value.trim(),
      material: document.getElementById('material').value,
      color: document.getElementById('color').value.trim(),
      quantity: document.getElementById('quantity').value || '1',
      size: document.getElementById('size').value.trim(),
      urgency: getUrgency(),
      deadline: document.getElementById('deadline').value,
      customDesign: isCustomDesign ? 'Yes' : 'No',
      customDescription: isCustomDesign ? document.getElementById('customDescription').value.trim() : '',
      customRefs: isCustomDesign ? document.getElementById('customRefs').value.trim() : '',
      customDimensions: isCustomDesign ? document.getElementById('customDimensions').value : '',
      customComplexity: isCustomDesign ? document.getElementById('customComplexity').value : '',
      notes: document.getElementById('notes').value.trim(),
      status: 'Pending'
    };

    setLoading(true);
    hideError();

    try {
      await fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      showSuccess();
    } catch (err) {
      showError('Submission failed. Check the Apps Script URL is configured correctly.');
      setLoading(false);
    }
  }

  function setLoading(on) {
    const btn = document.getElementById('submitBtn');
    const text = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    btn.disabled = on;
    text.style.display = on ? 'none' : 'block';
    spinner.style.display = on ? 'block' : 'none';
  }

  function showSuccess() {
    document.getElementById('formContent').style.display = 'none';
    document.getElementById('successMsg').style.display = 'block';
    document.getElementById('configNotice').style.display = 'none';
  }

  function showError(msg) {
    const el = document.getElementById('errorMsg');
    el.textContent = '⚠ ' + msg;
    el.style.display = 'block';
  }

  function hideError() {
    document.getElementById('errorMsg').style.display = 'none';
  }

  function resetForm() {
    document.getElementById('formContent').style.display = 'block';
    document.getElementById('successMsg').style.display = 'none';
    document.querySelectorAll('input[type=text], input[type=url], input[type=number], input[type=date], textarea, select').forEach(el => {
      if (el.type === 'number') el.value = '1';
      else el.value = '';
    });
    document.getElementById('u1').checked = true;
    isCustomDesign = false;
    document.getElementById('customToggle').classList.remove('active');
    document.getElementById('customDesignSection').classList.remove('visible');
    setLoading(false);
  }
</script>
</body>
</html>
